<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Bouncing DVD Logo</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background: #191919;
    }
    #dvd-logo {
      position: absolute;
      width: 200px;
      height: 90px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 24px #0008;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 48px;
      color: #222;
      letter-spacing: 5px;
      user-select: none;
      cursor: pointer;
      border: 6px solid #0af;
    }
  </style>
</head>
<body>
  <div id="dvd-logo"><img src="https://storage.googleapis.com/gweb-workspace-assets/uploads/7uffzv9dk4sn-2saPASNQaWzk3n5OvSnkAU-c912a0e13d9947bd5c831dd37283cea2-Sheets_Template5050Hero_Logo.svg"></div>
  <script>
    const logo = document.getElementById('dvd-logo');
    let x = Math.random() * (window.innerWidth - logo.offsetWidth);
    let y = Math.random() * (window.innerHeight - logo.offsetHeight);
    let dx = 3 + Math.random() * 2; // speed & direction
    let dy = 2.5 + Math.random();

    function randomColor() {
      // Return bright random color
      const h = Math.floor(Math.random() * 360);
      return `hsl(${h},90%,55%)`;
    }

    function moveLogo() {
      x += dx;
      y += dy;
      // bounce animation
      if (x <= 0 || x >= window.innerWidth - logo.offsetWidth) {
        dx *= -1;
        logo.style.borderColor = randomColor();
      }
      if (y <= 0 || y >= window.innerHeight - logo.offsetHeight) {
        dy *= -1;
        logo.style.borderColor = randomColor();
      }
      logo.style.left = `${x}px`;
      logo.style.top = `${y}px`;
      requestAnimationFrame(moveLogo);
    }

    logo.style.left = `${x}px`;
    logo.style.top = `${y}px`;

    // Click to randomize color
    logo.onclick = () => {
      logo.style.borderColor = randomColor();
    };

    moveLogo();

    // Responsive
    window.addEventListener('resize', () => {
      x = Math.min(x, window.innerWidth - logo.offsetWidth);
      y = Math.min(y, window.innerHeight - logo.offsetHeight);
    });
  </script>
</body>
</html>
