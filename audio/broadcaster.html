<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🎙️ Broadcaster (Final Debug)</title>
<style>
body { background: #000; color: #ccc; font-family: monospace; padding: 10px; }
input, select { background: #222; color: #fff; border: 1px solid #444; width: 100%; padding: 8px; margin-bottom: 5px; }
button { width: 100%; padding: 10px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
.btn-start { background: #0277bd; color: #fff; }
.btn-stop { background: #c62828; color: #fff; }
#viz { height: 50px; display: flex; align-items: flex-end; gap: 2px; margin-bottom: 10px; border: 1px solid #333; }
.bar { flex: 1; background: #4fc3f7; min-height: 2px; }
#log { height: 200px; overflow-y: scroll; border: 1px solid #333; font-size: 10px; white-space: pre-wrap; }
.rem { color: #66bb6a; } .loc { color: #4fc3f7; } .err { color: #ef5350; }
</style>
</head>
<body>
<h3>🎙️ Broadcaster <small>Final</small></h3>
<div id="viz"></div>
<input id="fbUrl" placeholder="Firebase URL">
<input id="roomId" placeholder="Room ID">
<select id="src"><option value="display">Display</option><option value="mic">Mic</option></select>
<button onclick="start()" class="btn-start" id="btnStart">Start</button>
<button onclick="stop()" class="btn-stop" id="btnStop" disabled>Stop</button>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const log = (m, c='') => {
  const t = new Date().toTimeString().split(' ')[0];
  $('log').innerHTML += `<div class="${c}">[${t}] ${m}</div>`;
  $('log').scrollTop = $('log').scrollHeight;
};

// Config
let FB_URL = localStorage.getItem('fb_url') || '';
if(FB_URL) $('fbUrl').value = FB_URL;
const ep = p => `${FB_URL}/${p}.json`;
const api = {
  get: async p => (await fetch(ep(p))).json(),
  put: async (p,d) => fetch(ep(p),{method:'PUT',body:JSON.stringify(d)}),
  del: async p => fetch(ep(p),{method:'DELETE'})
};

// Global
let stream, pcs=new Map(), pollT, hbT, ac, an;
const vizBox = $('viz');
for(let i=0; i<15; i++) { const b=document.createElement('div'); b.className='bar'; vizBox.appendChild(b); }

async function start() {
  FB_URL = $('fbUrl').value.replace(/\/$/,'');
  const rId = $('roomId').value.trim();
  if(!FB_URL || !rId) return log('URL/ID missing','err');
  localStorage.setItem('fb_url', FB_URL);

  $('btnStart').disabled = true; $('btnStop').disabled = false;
  
  try {
    const type = $('src').value;
    stream = await (type==='mic' ? navigator.mediaDevices.getUserMedia({audio:true}) : navigator.mediaDevices.getDisplayMedia({video:true,audio:true}));
    if(type!=='mic') stream.getVideoTracks().forEach(t=>t.stop());
    setupViz(stream);
    
    await api.put(`rooms/${rId}`, {bc:1});
    pollT = setInterval(() => poll(rId), 1000);
    hbT = setInterval(() => checkHB(rId), 2000);
    log(`Started Room: ${rId}`);
  } catch(e) { log(e.message,'err'); stop(); }
}

async function poll(rId) {
  try {
    const sigs = await api.get(`rooms/${rId}/signals/toBC`);
    if(!sigs) return;
    for(const [vid, d] of Object.entries(sigs)) {
      if(d.type==='request-offer') {
        log(`Req from ${vid}`);
        await handleReq(vid, rId);
        await api.del(`rooms/${rId}/signals/toBC/${vid}`);
      }
      if(d.type==='answer' && pcs.has(vid)) {
        await pcs.get(vid).pc.setRemoteDescription(d.sdp);
        log(`Answer Set (${vid})`);
        await api.del(`rooms/${rId}/signals/toBC/${vid}`);
      }
      if(d.ice && pcs.has(vid)) {
        await pcs.get(vid).pc.addIceCandidate(new RTCIceCandidate(d));
        log(`Remote ICE: ${d.candidate.split(' ')[4]} (${vid})`, 'rem');
        await api.del(`rooms/${rId}/signals/toBC/${vid}`);
      }
    }
  } catch(e) {}
}

async function handleReq(vid, rId) {
  if(pcs.has(vid)) pcs.get(vid).pc.close();
  const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pcs.set(vid, {pc, last:Date.now()});
  
  stream.getAudioTracks().forEach(t => pc.addTrack(t, stream));
  
  pc.onicecandidate = e => {
    if(e.candidate) {
      log(`Local ICE: ${e.candidate.candidate.split(' ')[4]}`, 'loc');
      api.put(`rooms/${rId}/signals/toViewer/${vid}/ice`, e.candidate.toJSON());
    }
  };
  pc.onconnectionstatechange = () => {
    if(pc.connectionState==='failed' || pc.connectionState==='disconnected') {
      log(`${vid} Disconnected`, 'err');
      pc.close(); pcs.delete(vid);
    }
  };

  const off = await pc.createOffer();
  await pc.setLocalDescription(off);
  await api.put(`rooms/${rId}/signals/toViewer/${vid}`, {type:'offer', sdp:{type:off.type, sdp:off.sdp}});
}

async function checkHB(rId) {
  // ハートビートチェック
  try {
    const hbs = await api.get(`rooms/${rId}/hb`);
    const now = Date.now();
    for(const [vid, info] of pcs.entries()) {
      const last = hbs && hbs[vid] ? hbs[vid] : 0;
      if(now - last > 6000) {
        log(`${vid} Timeout`, 'err');
        info.pc.close(); pcs.delete(vid);
      }
    }
  } catch(e){}
}

function setupViz(st) {
  ac = new AudioContext();
  an = ac.createAnalyser();
  const src = ac.createMediaStreamSource(st);
  src.connect(an);
  const data = new Uint8Array(an.frequencyBinCount);
  const bars = document.querySelectorAll('.bar');
  const draw = () => {
    if(!stream) return;
    an.getByteFrequencyData(data);
    bars.forEach((b,i) => b.style.height = (data[i+2]/255*48+2)+'px');
    requestAnimationFrame(draw);
  };
  draw();
}

function stop() {
  clearInterval(pollT); clearInterval(hbT);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  pcs.forEach(v=>v.pc.close()); pcs.clear(); stream=null;
  $('btnStart').disabled = false; $('btnStop').disabled = true;
  log('Stopped');
}
</script>
</body>
</html>
