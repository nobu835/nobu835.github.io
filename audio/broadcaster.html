<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🎙️ Broadcaster (Debug Mode)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #111; color: #ccc; padding: 10px; font-size: 14px; }
.container { max-width: 600px; margin: 0 auto; }
h1 { color: #4fc3f7; font-size: 1.2rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
input, select { width: 100%; padding: 10px; margin: 5px 0 10px; background: #222; border: 1px solid #444; color: #fff; }
button { width: 100%; padding: 12px; margin-bottom: 5px; cursor: pointer; font-weight: bold; }
.btn-start { background: #0277bd; color: #fff; border: none; }
.btn-stop { background: #c62828; color: #fff; border: none; }
button:disabled { opacity: 0.3; }
#logBox { background: #000; border: 1px solid #333; height: 300px; overflow-y: scroll; padding: 5px; font-size: 0.75rem; white-space: pre-wrap; margin-top: 10px; }
.log-time { color: #888; margin-right: 5px; }
.log-ice-rem { color: #66bb6a; }
.log-ice-loc { color: #4fc3f7; }
.log-err { color: #ef5350; }
</style>
</head>
<body>
<div class="container">
  <h1>🎙️ Broadcaster <small>[DEBUG]</small></h1>
  
  <label>Firebase URL</label>
  <input type="text" id="fbUrl">
  
  <label>Room ID</label>
  <input type="text" id="roomId" placeholder="room01">

  <label>Source</label>
  <select id="sourceType">
    <option value="display">Display Audio (画面共有)</option>
    <option value="mic">Microphone</option>
  </select>
  
  <button class="btn-start" id="btnStart" onclick="start()">Start Broadcast</button>
  <button class="btn-stop" id="btnStop" onclick="stop()" disabled>Stop</button>

  <div id="logBox"></div>
</div>

<script>
let FB_URL = localStorage.getItem('fb_url') || '';
if(FB_URL) document.getElementById('fbUrl').value = FB_URL;

const logBox = document.getElementById('logBox');
function log(msg, type='') {
  const t = new Date().toTimeString().slice(0,8);
  const colorClass = type ? `class="${type}"` : '';
  logBox.innerHTML += `<div ${colorClass}><span class="log-time">[${t}]</span>${msg}</div>`;
  logBox.scrollTop = logBox.scrollHeight;
  console.log(msg);
}

// --- Firebase ---
const ep = p => `${FB_URL}/${p}.json`;
async function fbPut(p,d) { await fetch(ep(p), {method:'PUT', body:JSON.stringify(d)}); }
async function fbGet(p) { const r = await fetch(ep(p)); return r.ok ? r.json() : null; }
async function fbDelete(p) { await fetch(ep(p), {method:'DELETE'}); }

// --- WebRTC ---
let localStream = null, peerConns = new Map(), pollTimer = null;
let roomId = '';

async function start() {
  FB_URL = document.getElementById('fbUrl').value.replace(/\/$/, '');
  roomId = document.getElementById('roomId').value.trim();
  if(!FB_URL || !roomId) return log('URLとRoomIDを入力してください', 'log-err');
  localStorage.setItem('fb_url', FB_URL);

  document.getElementById('btnStart').disabled = true;

  try {
    const type = document.getElementById('sourceType').value;
    if(type === 'mic') {
      localStream = await navigator.mediaDevices.getUserMedia({audio:true});
    } else {
      localStream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
    }
    log(`🎤 Stream取得成功: ${localStream.getAudioTracks().length} tracks`);
  } catch(e) {
    document.getElementById('btnStart').disabled = false;
    return log('❌ Stream取得失敗: ' + e.message, 'log-err');
  }

  await fbPut(`rooms/${roomId}`, {broadcaster:{online:true}});
  pollTimer = setInterval(pollSignals, 1000);
  document.getElementById('btnStop').disabled = false;
  log('*** 配信待機中 ***');
}

async function pollSignals() {
  const signals = await fbGet(`rooms/${roomId}/signals/toBC`);
  if(!signals) return;

  for(const [vid, data] of Object.entries(signals)) {
    if(data.type === 'request-offer') {
      log(`📩 Request受信 from ${vid}`);
      await handleRequest(vid);
      await fbDelete(`rooms/${roomId}/signals/toBC/${vid}`);
    }
    if(data.type === 'answer' && peerConns.has(vid)) {
      const pc = peerConns.get(vid);
      if(pc.signalingState === 'have-local-offer') {
        log(`📩 Answer受信 from ${vid}`);
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      }
      await fbDelete(`rooms/${roomId}/signals/toBC/${vid}`);
    }
    if(data.type === 'ice' && peerConns.has(vid)) {
      const pc = peerConns.get(vid);
      await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
      // 相手のIPをログ出力
      log(`📨 [REMOTE ICE] from ${vid}: ${data.candidate.candidate.split(' ').slice(4,8).join(' ')}`, 'log-ice-rem');
      await fbDelete(`rooms/${roomId}/signals/toBC/${vid}`);
    }
  }
}

async function handleRequest(vid) {
  if(peerConns.has(vid)) peerConns.get(vid).close();
  
  const pc = new RTCPeerConnection({ iceServers: [{urls:'stun:stun.l.google.com:19302'}] });
  peerConns.set(vid, pc);

  localStream.getAudioTracks().forEach(t => pc.addTrack(t, localStream));

  pc.onicecandidate = e => {
    if(e.candidate) {
      log(`📤 [MY ICE] for ${vid}: ${e.candidate.candidate.split(' ').slice(4,8).join(' ')}`, 'log-ice-loc');
      fbPut(`rooms/${roomId}/signals/toViewer/${vid}/ice`, e.candidate.toJSON());
    }
  };

  pc.onconnectionstatechange = () => {
    log(`🔄 State[${vid}]: ${pc.connectionState}`);
    if(pc.connectionState === 'failed') log(`❌ 接続失敗[${vid}]`, 'log-err');
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  
  await fbPut(`rooms/${roomId}/signals/toViewer/${vid}`, {
    type: 'offer', sdp: {type:offer.type, sdp:offer.sdp}
  });
  log(`📤 Offer送信 to ${vid}`);
}

function stop() {
  clearInterval(pollTimer);
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  peerConns.forEach(pc=>pc.close());
  peerConns.clear();
  log('*** 停止 ***');
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
}
</script>
</body>
</html>
