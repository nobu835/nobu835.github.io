<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 Audio Receiver (安定版)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #1a2a1a; color: #e0e0e0;
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: #1b2e1b; border-radius: 16px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
h1 { font-size: 1.4rem; color: #66bb6a; margin-bottom: 4px; }
label { display: block; font-size: 0.82rem; color: #a5d6a7; margin-bottom: 5px; }
input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #388e3c; background: #0a1f0a; color: #e0e0e0; margin-bottom: 14px; }
button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; }
.btn-primary { background: #66bb6a; color: #0a1f0a; }
.btn-danger { background: #e53935; color: #fff; margin-top: 10px; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.status { margin-top: 18px; padding: 12px; border-radius: 8px; font-size: 0.85rem; background: #0a1f0a; border-left: 4px solid #66bb6a; min-height: 48px; }
.status.error { border-left-color: #e53935; }
.log-box { margin-top:12px; background:#050f05; border:1px solid #1b5e20; border-radius:8px; padding:8px; font-family:monospace; font-size:0.7rem; color:#a5d6a7; max-height:150px; overflow-y:auto; line-height:1.4; word-break:break-all; }
.config-section { background:#0a1f0a; border:1px solid #1b5e20; border-radius:10px; padding:14px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="card">
  <h1>📱 Receiver <small>Stable</small></h1>
  
  <details class="config-section" id="configDetails" open>
    <summary style="color:#66bb6a;font-weight:bold;cursor:pointer">⚙️ Firebase 設定</summary>
    <div style="margin-top:10px;">
      <label>Firebase Database URL</label>
      <input type="text" id="fbUrl" placeholder="https://YOUR-PROJECT.firebaseio.com">
      <button class="btn-primary" onclick="saveConfig()" style="font-size:0.8rem;padding:8px;">保存して閉じる</button>
    </div>
  </details>

  <label>ルームID</label>
  <input type="text" id="roomId" placeholder="例: room01">
  <button id="btnConnect" class="btn-primary" onclick="connect()">🔗 接続開始</button>
  <button id="btnDisconnect" class="btn-danger" onclick="disconnect()" disabled>切断</button>

  <div id="statusBox" class="status">設定保存後、接続してください。</div>
  <div class="log-box" id="logBox"></div>
  <audio id="audioEl" autoplay playsinline></audio>
</div>

<script>
let FB_URL='';
const ep=p=>`${FB_URL}/${p}.json`;
async function fbGet(p){const r=await fetch(ep(p));return r.ok?r.json():null;}
async function fbPut(p,d){await fetch(ep(p),{method:'PUT',body:JSON.stringify(d)});}
async function fbPatch(p,d){await fetch(ep(p),{method:'PATCH',body:JSON.stringify(d)});}
async function fbDelete(p){await fetch(ep(p),{method:'DELETE'});}

function log(m,t=''){const b=document.getElementById('statusBox');b.className='status '+t;b.innerText=m;if(t==='error')dlog('ERR: '+m);}
function dlog(m){const b=document.getElementById('logBox');b.innerHTML+=`<div>[${new Date().toTimeString().slice(3,8)}] ${m}</div>`;b.scrollTop=b.scrollHeight;}

function saveConfig(){
  const url=document.getElementById('fbUrl').value.trim().replace(/\/$/,'');
  if(!url.startsWith('https')) return log('https://...を入力してください','error');
  FB_URL=url; localStorage.setItem('fb_url',FB_URL);
  document.getElementById('configDetails').removeAttribute('open');
  log('設定保存完了');
}
function loadConfig(){
  FB_URL=localStorage.getItem('fb_url')||'';
  if(FB_URL){document.getElementById('fbUrl').value=FB_URL;document.getElementById('configDetails').removeAttribute('open');}
}

// --- WebRTC ---
let pc=null, pollTimer=null, myViewerId=null, roomId='';
let candidateQueue = []; // ★重要: SDP設定前に届いたCandidateを溜める場所

const audioEl = document.getElementById('audioEl');

async function connect() {
  if(!FB_URL) return log('URL未設定','error');
  roomId = document.getElementById('roomId').value.trim();
  if(!roomId) return log('ルームID未入力','error');

  // iOS/Androidでの再生権限確保
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume(); 

  document.getElementById('btnConnect').disabled=true;
  document.getElementById('btnDisconnect').disabled=false;
  
  myViewerId = 'v-' + Math.random().toString(36).substr(2,7);
  candidateQueue = [];
  
  log('PCからの応答待ち...','waiting');
  dlog(`ID: ${myViewerId} 開始`);

  try {
    // 参加リクエスト
    await fbPut(`rooms/${roomId}/signals/toBC/${myViewerId}`, {type:'request-offer', ts:Date.now()});
    // 高頻度ポーリング開始
    pollTimer = setInterval(pollSignals, 800);
  } catch(e) {
    disconnect(); log('Network Error','error');
  }
}

async function pollSignals() {
  if(!roomId || !myViewerId) return;
  try {
    const data = await fbGet(`rooms/${roomId}/signals/toViewer/${myViewerId}`);
    if(!data) return;

    // Offer受信
    if(data.type === 'offer') {
      // 重複処理防止: まだPC作ってない時だけ
      if(!pc) {
        log('Offer受信。接続処理中...','waiting');
        await handleOffer(data.sdp);
      }
    }
    
    // ICE受信
    if(data.ice) {
      const candidates = Array.isArray(data.ice) ? data.ice : [data.ice];
      for(const c of candidates) {
        if(c && c.candidate) await handleCandidate(c);
      }
      // 処理したら消す
      await fbDelete(`rooms/${roomId}/signals/toViewer/${myViewerId}/ice`);
    }
  } catch(e) { console.warn(e); }
}

// ★重要: Candidate追加処理（キュー制御付き）
async function handleCandidate(ice) {
  const candidate = new RTCIceCandidate(ice);
  // リモートSDPがまだセットされてなければキューに入れる
  if (!pc || !pc.remoteDescription) {
    candidateQueue.push(candidate);
    dlog(`ICE保留 (Queue: ${candidateQueue.length})`);
  } else {
    try {
      await pc.addIceCandidate(candidate);
      dlog('ICE追加成功');
    } catch (e) { dlog('ICE追加失敗: ' + e.message); }
  }
}

// ★重要: キューの消化
async function drainCandidateQueue() {
  dlog(`ICEキュー消化開始 (${candidateQueue.length}個)`);
  for (const c of candidateQueue) {
    try { await pc.addIceCandidate(c); } catch (e) {}
  }
  candidateQueue = [];
}

function setSdpStereo(sdp) {
  return sdp.replace(/a=fmtp:(\d+) (.*)/g, (match, pt, params) => {
    if (params.includes('stereo=1')) return match;
    return `a=fmtp:${pt} ${params};stereo=1;sprop-stereo=1;maxaveragebitrate=510000;useinbandfec=1`;
  });
}

async function handleOffer(remoteSdp) {
  pc = new RTCPeerConnection({
    iceServers: [{urls:'stun:stun.l.google.com:19302'}],
    iceCandidatePoolSize: 4
  });

  // ICE送信
  pc.onicecandidate = e => {
    if(e.candidate) {
      fbPatch(`rooms/${roomId}/signals/toBC/${myViewerId}`, {type:'ice', candidate:e.candidate.toJSON()});
    }
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    dlog(`State: ${s}`);
    if(s === 'connected') log('✅ 接続成功！音声受信中', 'ok');
    if(s === 'failed') {
      log('❌ 接続失敗 (ICE Failure)', 'error');
      // 失敗時の詳細ログ
      dlog(`ICE State: ${pc.iceConnectionState}`);
    }
    if(s === 'disconnected') log('⚠️ 切断', 'error');
  };

  pc.ontrack = e => {
    dlog(`Track受信: ${e.track.kind}`);
    audioEl.srcObject = e.streams[0];
    audioEl.play().catch(() => {
      log('⚠️ 画面をタップしてください','waiting');
      document.body.addEventListener('click',()=>audioEl.play(),{once:true});
    });
  };

  // SDP処理
  try {
    const sdpWithStereo = setSdpStereo(remoteSdp.sdp);
    await pc.setRemoteDescription(new RTCSessionDescription({type:'offer', sdp:sdpWithStereo}));
    dlog('RemoteDesc Set OK');
    
    // ★ここで溜まっていたICEを処理
    await drainCandidateQueue();

    const answer = await pc.createAnswer();
    answer.sdp = setSdpStereo(answer.sdp);
    await pc.setLocalDescription(answer);
    
    await fbPatch(`rooms/${roomId}/signals/toBC/${myViewerId}`, {
      type: 'answer', sdp: {type:answer.type, sdp:answer.sdp}
    });
    dlog('Answer送信');
  } catch(e) {
    dlog('SDP Error: ' + e.message);
  }
}

function disconnect() {
  clearInterval(pollTimer);
  if(pc) pc.close();
  if(roomId && myViewerId) fbDelete(`rooms/${roomId}/signals/toBC/${myViewerId}`);
  pc = null;
  audioEl.srcObject = null;
  document.getElementById('btnConnect').disabled=false;
  document.getElementById('btnDisconnect').disabled=true;
  log('切断しました');
}

loadConfig();
</script>
</body>
</html>
