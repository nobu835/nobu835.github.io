<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 Receiver (Final Debug)</title>
<style>
body { background: #000; color: #ccc; font-family: monospace; padding: 10px; }
input { background: #222; color: #fff; border: 1px solid #444; width: 100%; padding: 8px; margin-bottom: 5px; }
button { width: 100%; padding: 10px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
.btn-con { background: #2e7d32; color: #fff; }
.btn-dis { background: #c62828; color: #fff; }
#viz { height: 50px; display: flex; align-items: flex-end; gap: 2px; margin-bottom: 10px; border: 1px solid #333; }
.bar { flex: 1; background: #66bb6a; min-height: 2px; }
#log { height: 200px; overflow-y: scroll; border: 1px solid #333; font-size: 10px; white-space: pre-wrap; }
.rem { color: #4fc3f7; } .loc { color: #a5d6a7; } .err { color: #ef5350; } .ok { color: #66bb6a; }
</style>
</head>
<body>
<h3>📱 Receiver <small>Final</small></h3>
<div id="viz"></div>
<input id="fbUrl" placeholder="Firebase URL">
<input id="roomId" placeholder="Room ID">
<button onclick="start()" class="btn-con" id="btnStart">Connect</button>
<button onclick="stop()" class="btn-dis" id="btnStop" disabled>Disconnect</button>
<div id="log"></div>
<audio id="au" autoplay playsinline></audio>

<script>
const $ = id => document.getElementById(id);
const log = (m, c='') => {
  const t = new Date().toTimeString().split(' ')[0];
  $('log').innerHTML += `<div class="${c}">[${t}] ${m}</div>`;
  $('log').scrollTop = $('log').scrollHeight;
};

// Config
let FB_URL = localStorage.getItem('fb_url') || '';
if(FB_URL) $('fbUrl').value = FB_URL;
const ep = p => `${FB_URL}/${p}.json`;
const api = {
  get: async p => (await fetch(ep(p))).json(),
  put: async (p,d) => fetch(ep(p),{method:'PUT',body:JSON.stringify(d)}),
  del: async p => fetch(ep(p),{method:'DELETE'})
};

// Global
let pc, myId, pollT, hbT, ac, an;
const vizBox = $('viz');
for(let i=0; i<15; i++) { const b=document.createElement('div'); b.className='bar'; vizBox.appendChild(b); }

async function start() {
  FB_URL = $('fbUrl').value.replace(/\/$/,'');
  const rId = $('roomId').value.trim();
  if(!FB_URL || !rId) return log('URL/ID missing','err');
  localStorage.setItem('fb_url', FB_URL);

  $('btnStart').disabled = true; $('btnStop').disabled = false;
  
  ac = new (window.AudioContext||window.webkitAudioContext)();
  await ac.resume();

  myId = 'v-'+Math.floor(Math.random()*9999);
  log(`ID: ${myId} Start`);

  try {
    await api.put(`rooms/${rId}/signals/toBC/${myId}`, {type:'request-offer'});
    pollT = setInterval(() => poll(rId), 1000);
    hbT = setInterval(() => api.put(`rooms/${rId}/hb/${myId}`, Date.now()), 2000);
  } catch(e) { log(e.message,'err'); stop(); }
}

async function poll(rId) {
  try {
    const d = await api.get(`rooms/${rId}/signals/toViewer/${myId}`);
    if(!d) return;
    
    if(d.type === 'offer' && !pc) {
      log('Offer Recv -> Handle');
      await handleOffer(d.sdp, rId);
    }
    if(d.ice && pc && pc.remoteDescription) {
      await pc.addIceCandidate(new RTCIceCandidate(d.ice));
      log(`Remote ICE: ${d.ice.candidate.split(' ')[4]}`, 'rem'); // IP表示
      await api.del(`rooms/${rId}/signals/toViewer/${myId}/ice`);
    }
  } catch(e) {}
}

async function handleOffer(sdp, rId) {
  pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  
  pc.onicecandidate = e => {
    if(e.candidate) {
      // ★ここで自分のIPを確認
      log(`Local ICE: ${e.candidate.candidate.split(' ')[4]}`, 'loc'); 
      api.put(`rooms/${rId}/signals/toBC/${myId}/ice`, e.candidate.toJSON());
    }
  };
  
  pc.onconnectionstatechange = () => {
    log(`State: ${pc.connectionState}`, pc.connectionState==='connected'?'ok':'');
    if(pc.connectionState==='failed') log('Failed (IP Unreachable)', 'err');
  };

  pc.ontrack = e => {
    log('Track Recv (Audio)', 'ok');
    $('au').srcObject = e.streams[0];
    $('au').play().catch(e=>log('Tap Screen!','err'));
    setupViz(e.streams[0]);
  };

  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  await api.put(`rooms/${rId}/signals/toBC/${myId}`, {type:'answer', sdp:{type:ans.type, sdp:ans.sdp}});
}

function setupViz(stream) {
  if(!ac) return;
  an = ac.createAnalyser();
  an.fftSize = 64;
  const src = ac.createMediaStreamSource(stream);
  src.connect(an);
  const data = new Uint8Array(an.frequencyBinCount);
  const bars = document.querySelectorAll('.bar');
  const draw = () => {
    if(!pc) return;
    an.getByteFrequencyData(data);
    bars.forEach((b,i) => b.style.height = (data[i+2]/255*48+2)+'px');
    requestAnimationFrame(draw);
  };
  draw();
}

function stop() {
  clearInterval(pollT); clearInterval(hbT);
  if(pc) pc.close(); pc=null;
  $('au').srcObject = null;
  $('btnStart').disabled = false; $('btnStop').disabled = true;
  log('Stopped');
}
</script>
</body>
</html>
