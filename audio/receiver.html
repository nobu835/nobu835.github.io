<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 Receiver (Debug Mode)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #111; color: #ccc; padding: 10px; font-size: 14px; }
.container { max-width: 600px; margin: 0 auto; }
h1 { color: #66bb6a; font-size: 1.2rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
input { width: 100%; padding: 10px; margin: 5px 0 10px; background: #222; border: 1px solid #444; color: #fff; }
button { width: 100%; padding: 12px; margin-bottom: 5px; cursor: pointer; font-weight: bold; }
.btn-connect { background: #2e7d32; color: #fff; border: none; }
.btn-test { background: #f9a825; color: #000; border: none; }
.btn-stop { background: #c62828; color: #fff; border: none; }
button:disabled { opacity: 0.3; }
#logBox { background: #000; border: 1px solid #333; height: 300px; overflow-y: scroll; padding: 5px; font-size: 0.75rem; white-space: pre-wrap; margin-top: 10px; }
.log-time { color: #888; margin-right: 5px; }
.log-ice-rem { color: #4fc3f7; } /* 相手の候補 */
.log-ice-loc { color: #a5d6a7; } /* 自分の候補 */
.log-err { color: #ef5350; }
.log-ok { color: #66bb6a; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h1>📱 Audio Receiver <small>[DEBUG]</small></h1>
  
  <label>Firebase URL</label>
  <input type="text" id="fbUrl" placeholder="https://PROJECT.firebaseio.com">
  
  <label>Room ID</label>
  <input type="text" id="roomId" placeholder="room01">
  
  <button class="btn-connect" id="btnConnect" onclick="connect()">Connect (受信開始)</button>
  <button class="btn-test" onclick="playTestSound()">🔔 Test Sound (音出し確認)</button>
  <button class="btn-stop" id="btnDisconnect" onclick="disconnect()" disabled>Disconnect</button>

  <div id="logBox"></div>
  <audio id="audioEl" autoplay playsinline></audio>
</div>

<script>
let FB_URL = localStorage.getItem('fb_url') || '';
if(FB_URL) document.getElementById('fbUrl').value = FB_URL;

const logBox = document.getElementById('logBox');
function log(msg, type='') {
  const t = new Date().toTimeString().slice(0,8);
  const colorClass = type ? `class="${type}"` : '';
  logBox.innerHTML += `<div ${colorClass}><span class="log-time">[${t}]</span>${msg}</div>`;
  logBox.scrollTop = logBox.scrollHeight;
  console.log(msg);
}

// サウンドテスト機能（復活）
function playTestSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880; 
    gain.gain.value = 0.1;
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, 300);
    log('🔔 テスト音再生指示', 'log-ok');
  } catch(e) {
    log('❌ テスト音再生失敗: ' + e.message, 'log-err');
  }
}

// --- Firebase ---
const ep = p => `${FB_URL}/${p}.json`;
async function fbPut(p,d) { await fetch(ep(p), {method:'PUT', body:JSON.stringify(d)}); }
async function fbGet(p) { const r = await fetch(ep(p)); return r.ok ? r.json() : null; }
async function fbDelete(p) { await fetch(ep(p), {method:'DELETE'}); }

// --- WebRTC ---
let pc = null, pollTimer = null, myViewerId = null, roomId = '';
let candidateQueue = [];

async function connect() {
  FB_URL = document.getElementById('fbUrl').value.replace(/\/$/, '');
  roomId = document.getElementById('roomId').value.trim();
  if(!FB_URL || !roomId) return log('URLとRoomIDを入力してください', 'log-err');
  localStorage.setItem('fb_url', FB_URL);

  document.getElementById('btnConnect').disabled = true;
  document.getElementById('btnDisconnect').disabled = false;

  // AudioContext再開（モバイル用）
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();

  myViewerId = 'v-' + Math.random().toString(36).substr(2, 5);
  candidateQueue = [];
  log(`*** 接続開始 ID:${myViewerId} ***`);

  try {
    await fbPut(`rooms/${roomId}/signals/toBC/${myViewerId}`, {type:'request-offer'});
    pollTimer = setInterval(pollSignals, 1000);
  } catch(e) {
    log('Firebase Error: ' + e.message, 'log-err');
    disconnect();
  }
}

async function pollSignals() {
  if(!myViewerId) return;
  try {
    const data = await fbGet(`rooms/${roomId}/signals/toViewer/${myViewerId}`);
    if(!data) return;

    if(data.type === 'offer') {
      if(!pc) {
        log('📩 Offer受信 -> PC作成');
        await handleOffer(data.sdp);
      }
    }
    if(data.ice) {
      const list = Array.isArray(data.ice) ? data.ice : [data.ice];
      for(const c of list) await handleCandidate(c);
      await fbDelete(`rooms/${roomId}/signals/toViewer/${myViewerId}/ice`);
    }
  } catch(e) {}
}

async function handleCandidate(ice) {
  // デバッグ: 相手から来たCandidateの中身を表示
  const cObj = new RTCIceCandidate(ice);
  log(`📨 [REMOTE ICE] ${cObj.candidate.split(' ').slice(4,8).join(' ')}`, 'log-ice-rem'); // IPアドレス部分を抽出表示

  if(!pc || !pc.remoteDescription) {
    candidateQueue.push(cObj);
    log(`   -> 保留 (Queue:${candidateQueue.length})`);
  } else {
    try {
      await pc.addIceCandidate(cObj);
      log('   -> 追加成功');
    } catch(e) { log('   -> 追加失敗: '+e.message, 'log-err'); }
  }
}

async function handleOffer(sdp) {
  pc = new RTCPeerConnection({
    iceServers: [{urls:'stun:stun.l.google.com:19302'}]
  });

  // 自分(Receiver)側のCandidateを表示
  pc.onicecandidate = e => {
    if(e.candidate) {
      log(`📤 [MY ICE] ${e.candidate.candidate.split(' ').slice(4,8).join(' ')}`, 'log-ice-loc');
      fbPut(`rooms/${roomId}/signals/toBC/${myViewerId}/ice`, e.candidate.toJSON()).catch(()=>{});
    } else {
      log('✅ ICE収集完了 (Gathering Complete)');
    }
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    log(`🔄 Connection State: ${s}`, s==='connected'?'log-ok':'');
  };
  
  pc.oniceconnectionstatechange = () => {
    log(`❄️ ICE State: ${pc.iceConnectionState}`);
  };

  pc.ontrack = e => {
    log(`🎵 Track受信: kind=${e.track.kind}, id=${e.track.id}`, 'log-ok');
    const el = document.getElementById('audioEl');
    el.srcObject = e.streams[0];
    el.play().then(()=>log('▶️ 再生開始成功', 'log-ok')).catch(err=>log('⚠️ 自動再生失敗: '+err.message));
  };

  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  log('SetRemoteDesc OK');
  
  // 保留していたICEを処理
  if(candidateQueue.length) {
    log(`📦 Queue消化: ${candidateQueue.length}個`);
    for(const c of candidateQueue) await pc.addIceCandidate(c).catch(()=>{});
    candidateQueue = [];
  }

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  
  await fbPut(`rooms/${roomId}/signals/toBC/${myViewerId}`, {
    type: 'answer', sdp: {type:answer.type, sdp:answer.sdp}
  });
  log('📤 Answer送信');
}

function disconnect() {
  clearInterval(pollTimer);
  if(pc) pc.close();
  pc = null;
  log('*** 切断 ***');
  document.getElementById('btnConnect').disabled = false;
  document.getElementById('btnDisconnect').disabled = true;
}
</script>
</body>
</html>
