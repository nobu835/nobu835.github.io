<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 Audio Receiver (スマホ)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: #1a2a1a;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #1b2e1b;
  border-radius: 16px;
  padding: 28px 22px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
h1 { font-size: 1.4rem; color: #66bb6a; margin-bottom: 4px; }
.subtitle { color: #81c784; font-size: 0.82rem; margin-bottom: 22px; }
label { display: block; font-size: 0.82rem; color: #a5d6a7; margin-bottom: 5px; }
input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1px solid #388e3c;
  background: #0a1f0a;
  color: #e0e0e0;
  font-size: 1rem;
  margin-bottom: 14px;
}
button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: none;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}
.btn-primary { background: #66bb6a; color: #0a1f0a; }
.btn-primary:hover:not(:disabled) { background: #81c784; }
.btn-danger  { background: #e53935; color: #fff; margin-top: 10px; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.status {
  margin-top: 18px;
  padding: 14px 16px;
  border-radius: 10px;
  font-size: 0.88rem;
  background: #0a1f0a;
  border-left: 4px solid #66bb6a;
  line-height: 1.7;
  min-height: 56px;
}
.status.error   { border-left-color: #e53935; }
.status.ok      { border-left-color: #66bb6a; }
.status.waiting { border-left-color: #ffca28; }
audio { display: none; }
.visualizer { margin-top: 14px; display:flex; gap:3px; align-items:flex-end; height:40px; }
.bar { flex:1; background:#66bb6a; border-radius:3px 3px 0 0; min-height:4px; transition:height 0.05s; }
.vol-control { margin-top:14px; display:flex; align-items:center; gap:10px; font-size:0.82rem; color:#a5d6a7; }
input[type=range] { flex:1; margin-bottom:0; accent-color:#66bb6a; cursor:pointer; }
.config-section {
  background: #0a1f0a;
  border: 1px solid #1b5e20;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
}
.config-section summary {
  cursor: pointer;
  font-size: 0.83rem;
  color: #66bb6a;
  font-weight: 600;
  user-select: none;
}
.config-section[open] summary { margin-bottom: 10px; }
.hint { font-size:0.76rem; color:#4a7c59; margin-top:-10px; margin-bottom:10px; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>📱 Audio Receiver</h1>
  <p class="subtitle">PCのオーディオをリアルタイム受信</p>

  <details class="config-section" id="configDetails" open>
    <summary>⚙️ Firebase 設定（初回のみ）</summary>
    <label>Firebase Database URL</label>
    <input type="text" id="fbUrl"
           placeholder="https://YOUR-PROJECT-default-rtdb.firebaseio.com">
    <p class="hint">
      ※ API Key は不要です。Database URL のみで動作します。<br>
      ※ 設定は localStorage に保存されます。
    </p>
    <button class="btn-primary"
            onclick="saveConfig()"
            style="width:auto;padding:8px 20px;font-size:0.83rem;">保存</button>
  </details>

  <label>ルームID（PCと同じIDを入力）</label>
  <input type="text" id="roomId" placeholder="例: room-abc123">

  <button id="btnConnect"    class="btn-primary" onclick="connect()">🔗 接続して受信開始</button>
  <button id="btnDisconnect" class="btn-danger"  onclick="disconnect()" disabled>切断</button>

  <div id="statusBox" class="status">Firebase Database URLを保存後、ルームIDを入力して接続してください。</div>
  <div class="visualizer" id="visualizer"></div>
  <div class="vol-control">
    🔊 音量
    <input type="range" id="volume" min="0" max="2" step="0.05" value="1"
           oninput="setVolume(this.value)">
    <span id="volLabel">100%</span>
  </div>
  <audio id="audioEl" autoplay playsinline></audio>
</div>

<script>
// ── Firebase REST helper（認証なし）────────────────────────────
let FB_URL = '';

function endpoint(path) {
  return `${FB_URL}/${path}.json`;
}

async function fbPut(path, data) {
  const res = await fetch(endpoint(path), {
    method: 'PUT',
    body: JSON.stringify(data),
    headers: { 'Content-Type': 'application/json' }
  });
  if (!res.ok) throw new Error(`Firebase PUT failed: ${res.status} ${await res.text()}`);
}

async function fbPatch(path, data) {
  const res = await fetch(endpoint(path), {
    method: 'PATCH',
    body: JSON.stringify(data),
    headers: { 'Content-Type': 'application/json' }
  });
  if (!res.ok) throw new Error(`Firebase PATCH failed: ${res.status} ${await res.text()}`);
}

async function fbDelete(path) {
  await fetch(endpoint(path), { method: 'DELETE' });
}

function fbListen(path, callback) {
  const es = new EventSource(endpoint(path));
  es.addEventListener('put',   (e) => { const {data} = JSON.parse(e.data); if (data !== null) callback(data); });
  es.addEventListener('patch', (e) => { const {data} = JSON.parse(e.data); if (data !== null) callback(data); });
  es.onerror = (e) => console.warn('EventSource error', e);
  return es;
}

// ── Config ─────────────────────────────────────────────────────
function saveConfig() {
  const url = document.getElementById('fbUrl').value.trim().replace(/\/$/, '');
  if (!url.startsWith('https://')) {
    return log('⚠️ https:// から始まる Database URL を入力してください', 'error');
  }
  FB_URL = url;
  localStorage.setItem('fb_url', FB_URL);
  log('✅ Firebase設定を保存しました。', 'ok');
  document.getElementById('configDetails').removeAttribute('open');
}

function loadConfig() {
  FB_URL = localStorage.getItem('fb_url') || '';
  if (FB_URL) {
    document.getElementById('fbUrl').value = FB_URL;
    log('✅ Firebase設定を読み込みました。ルームIDを入力して接続してください。', 'ok');
    document.getElementById('configDetails').removeAttribute('open');
  }
}

// ── Visualizer ─────────────────────────────────────────────────
const viz = document.getElementById('visualizer');
for (let i = 0; i < 20; i++) {
  const b = document.createElement('div');
  b.className = 'bar'; b.style.height = '4px';
  viz.appendChild(b);
}

// ── State ───────────────────────────────────────────────────────
let pc = null, gainNode = null, audioCtx = null, analyser = null;
let esSignal = null, animFrame = null;
let myViewerId = null, roomId = '';
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

function log(msg, type = '') {
  const b = document.getElementById('statusBox');
  b.className = 'status ' + type;
  b.innerHTML = msg;
}

// ── Connect ────────────────────────────────────────────────────
async function connect() {
  if (!FB_URL) return log('⚠️ 先にFirebase Database URLを保存してください', 'error');
  roomId = document.getElementById('roomId').value.trim();
  if (!roomId) return log('⚠️ ルームIDを入力してください', 'error');

  document.getElementById('btnConnect').disabled = true;
  myViewerId = Date.now().toString(36) + Math.random().toString(36).slice(2);

  log('⏳ PCの配信を待機中... オファーをリクエストします', 'waiting');

  // Broadcasterへオファーをリクエスト
  try {
    await fbPut(`rooms/${roomId}/signals/toBC/${myViewerId}`, {
      type: 'request-offer',
      ts: Date.now()
    });
  } catch (e) {
    document.getElementById('btnConnect').disabled = false;
    return log(`❌ Firebase書き込み失敗: ${e.message}<br>Realtime Databaseのルール設定を確認してください。`, 'error');
  }

  // Broadcasterからのシグナルを受信
  esSignal = fbListen(`rooms/${roomId}/signals/toViewer/${myViewerId}`, async (data) => {
    if (data.type === 'offer') {
      await handleOffer(data.sdp);
    }
    if (data.ice) {
      if (!pc) return;
      const candidates = Array.isArray(data.ice) ? data.ice : Object.values(data.ice);
      for (const c of candidates) {
        await pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
      }
    }
  });
}

async function handleOffer(offerSdp) {
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  const iceBatch = [];
  let iceTimer = null;
  pc.onicecandidate = ({ candidate }) => {
    if (!candidate) return;
    iceBatch.push(candidate.toJSON());
    clearTimeout(iceTimer);
    iceTimer = setTimeout(() => {
      fbPatch(`rooms/${roomId}/signals/toBC/${myViewerId}`, {
        type: 'ice',
        candidate: iceBatch.splice(0)
      }).catch(console.error);
    }, 100);
  };

  pc.ontrack = (e) => {
    setupAudio(e.streams[0]);
    log('🎵 受信・再生中！', 'ok');
    document.getElementById('btnDisconnect').disabled = false;
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') {
      log('✅ 接続確立 - オーディオ受信中', 'ok');
    } else if (s === 'failed') {
      log('❌ 接続失敗 - 再試行してください', 'error');
    } else if (s === 'disconnected') {
      log('⚠️ 接続が切断されました', 'warning');
      stopVisualizer();
    }
  };

  await pc.setRemoteDescription(new RTCSessionDescription(offerSdp));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await fbPatch(`rooms/${roomId}/signals/toBC/${myViewerId}`, {
    type: 'answer',
    sdp: { type: answer.type, sdp: answer.sdp }
  });
}

function setupAudio(stream) {
  audioCtx = new AudioContext();
  const src = audioCtx.createMediaStreamSource(stream);
  gainNode  = audioCtx.createGain();
  gainNode.gain.value = parseFloat(document.getElementById('volume').value);
  analyser  = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  src.connect(gainNode);
  gainNode.connect(analyser);
  const dest = audioCtx.createMediaStreamDestination();
  gainNode.connect(dest);
  document.getElementById('audioEl').srcObject = dest.stream;
  document.getElementById('audioEl').play().catch(() => {});
  startVisualizer();
}

function disconnect() {
  if (pc)       { pc.close(); pc = null; }
  if (esSignal) { esSignal.close(); esSignal = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (roomId && myViewerId) {
    fbDelete(`rooms/${roomId}/signals/toBC/${myViewerId}`);
    fbDelete(`rooms/${roomId}/signals/toViewer/${myViewerId}`);
  }
  stopVisualizer();
  document.getElementById('btnConnect').disabled = false;
  document.getElementById('btnDisconnect').disabled = true;
  log('切断しました');
}

function setVolume(val) {
  if (gainNode) gainNode.gain.value = parseFloat(val);
  document.getElementById('volLabel').textContent = Math.round(val * 100) + '%';
}

function startVisualizer() {
  const bars = viz.querySelectorAll('.bar');
  const data = new Uint8Array(analyser.frequencyBinCount);
  (function draw() {
    analyser.getByteFrequencyData(data);
    bars.forEach((bar, i) => {
      bar.style.height = ((data[i] || 0) / 255 * 36 + 4) + 'px';
    });
    animFrame = requestAnimationFrame(draw);
  })();
}
function stopVisualizer() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  viz.querySelectorAll('.bar').forEach(b => b.style.height = '4px');
}

loadConfig();
</script>
</body>
</html>
