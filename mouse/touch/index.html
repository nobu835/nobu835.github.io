<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タップデータ送信</title>
    <style>
        html, body {
            overscroll-behavior-y: none;
            overscroll-behavior: none;
        }

    </style>
</head>
<body>
  宛先<input id="ip_address"><button id="btn_connect">接続</button><button id="btn_rst">リセット</button>
  <div id="Data"></div>
  <div id="logtext"></div>
  <div id="hoge"></div>
  a
  <script>
    const currentDomain = window.location.hostname; //"192.168.1.8"のような"hoge.com"のような
    document.getElementById("ip_address").value=currentDomain;
    let touchpast=[0,0];
    let move=[0,0];
    let start=[0,0];
    let socket=null

    document.addEventListener('touchstart', function(event) {
        const touch = event.touches[0];
        const x = touch.clientX;
        const y = touch.clientY;
        touchpast=[x,y];
        start=[x,y];
        console.log('タップ位置: x=' + x + ', y=' + y);
        document.getElementById("Data").textContent=`${x},${y}`;
    });

    document.addEventListener('touchmove', function(event) {
        event.preventDefault(); // スクロールを防止
        const touch = event.touches[0];
        const x = touch.clientX;
        const y = touch.clientY;
        console.log('タッチ位置: x=' + x + ', y=' + y);
        document.getElementById("Data").textContent=`${x},${y}`;
        move[0]=x-touchpast[0];
        move[1]=y-touchpast[1];
        document.getElementById("logtext").textContent=`${move[0]},${move[1]}`;
        touchpast=[x,y];
        send();
    }, { passive: false });
    document.addEventListener('touchend', function(event) {
        let click=false;
        move=[0,0];
        const touch = event.changedTouches[0];
        const x = touch.clientX;
        const y = touch.clientY;
        if(x===start[0] && y===start[1]){
            click=true;
        }

        document.getElementById("logtext").textContent=`${move[0]},${move[1]}`;
        //document.getElementById("hoge").textContent=`えんど`;
        send(click);
    });
    function send(mousedown=false){
        if(socket!=null){
            //document.getElementById("hoge").textContent=mousedown;
            move[2]=mousedown*1; //boolに1をかけると数値になる
            socket.send(move);
        }
    }

    const button = document.getElementById('btn_connect');
    button.addEventListener('click', () => {
        //接続ボタンを押したとき
        //alert("aaa");
        try{
            const ip=document.getElementById('ip_address').value;
            console.log(`ws://${ip}:2001に接続を試みています…`);
            document.getElementById("logtext").textContent=`ws://${ip}:2001に接続を試みています…`;
            socket = new WebSocket(`ws://${ip}:2001`);
            //document.getElementById("logtext").textContent=`成功しました`;
        }catch{
            socket=null;
            console.log("err");
            document.getElementById("logtext").textContent=`失敗しました`;
        }
    });
  </script>
</body>
